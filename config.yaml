# Настройки подключения к Modbus TCP устройствам

# Интервал опроса устройств (секунды)
poll_interval: 5

# Список опрашиваемых Modbus устройств
devices:
  - host: "192.168.1.1"       # IP-адрес устройства
    port: 502                  # TCP-порт (502 по умолчанию)
    device_id: 1               # ID устройства в сети Modbus

# Список опрашиваемых OPC UA устройств
opcua_devices:
  - url: "opc.tcp://192.168.1.10:4840"  # URL OPC UA сервера
    timeout: 10                          # Таймаут подключения (секунды)

# Список опрашиваемых S7-1200/1500 устройств (S7CommPlus)
s7_devices:
  - host: "192.168.1.20"             # IP-адрес PLC
    rack: 0                          # Rack номер (обычно 0)
    slot: 1                          # Slot номер (обычно 1)
    name: "PLC_01"                   # Имя устройства (для привязки тегов)
    use_tls: false                   # Использовать TLS (для S7-1500 FW 2.x+)
    # tls_cert: "path/to/cert.pem"   # Путь к сертификату клиента
    # tls_key: "path/to/key.pem"     # Путь к приватному ключу
    # tls_ca: "path/to/ca.pem"       # Путь к CA сертификату
    # password: ""                   # Пароль PLC (опционально)
