# Настройки подключения к Modbus TCP устройствам

# Интервал опроса устройств (секунды)
poll_interval: 5

# Список опрашиваемых Modbus устройств
devices:
  - host: "192.168.1.1"       # IP-адрес устройства
    port: 502                  # TCP-порт (502 по умолчанию)
    device_id: 1               # ID устройства в сети Modbus

# Список опрашиваемых OPC UA устройств
opcua_devices:
  - url: "opc.tcp://192.168.1.10:4840"  # URL OPC UA сервера
    timeout: 10                          # Таймаут подключения (секунды)
